name: Artemide Duo APK

on:
  push:
    branches: [duo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleNonRoot_gameDuo -PduoVersion=0.${{ github.run_number }} --stacktrace 2>&1 | tee build.log

      # Surface compiler errors as annotations (readable without log access).
      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|\.java:[0-9]+: |What went wrong|e: " build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -A 6 "What went wrong" build.log | head -20 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: artemide-duo-apks
          path: out/*.apk

      # A release is easier to download on the phone than a zipped artifact.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: Artemide Duo v0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          body: |
            Install the file with **arm64-v8a** in its name on the Surface Duo.
            Commit: ${{ github.sha }}
          files: out/*arm64-v8a*.apk
